name: Build

on:
  merge_group:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: sylphx-linux-standard


    # strategy:
    #  matrix:
    #   sdk: [ dev, beta, stable ]

    steps:
      - uses: actions/checkout@v2
      - uses: subosito/flutter-action@v1

      - name: Install dependencies
        run: dart pub get


      - name: Check format
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage to codecov
        run: curl -s https://codecov.io/bash | bash

  # Aggregate gate: every required job must succeed before this check passes.
  ci-ok:
    if: ${{ always() }}
    needs: [build]
    runs-on: sylphx-linux-standard
    timeout-minutes: 5
    steps:
      - name: Require every selected job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          REQUIRED: build
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          required = {job.strip() for job in os.environ["REQUIRED"].split(",") if job.strip()}
          if not isinstance(needs, dict) or not needs or not required:
              sys.exit("ci-ok: needs and required jobs must be nonempty")
          failed = {job: "absent" for job in required - needs.keys()}
          for job, value in sorted(needs.items()):
              result = value.get("result") if isinstance(value, dict) else None
              print(f"{job}: {result}")
              if result not in ("success", "skipped") or (job in required and result != "success"):
                  failed[job] = result or "absent"
          if failed:
              sys.exit(f"ci-ok: required jobs did not succeed: {failed}")
          PY
